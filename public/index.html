<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Blogger SEO Intelligence</title>

<style>
:root{
  font-family:system-ui,sans-serif;
  color:#172033;
  background:#f4f6fa
}
body{margin:0}
.wrap{max-width:980px;margin:32px auto;padding:18px}
.card{
  background:#fff;
  border:1px solid #e1e5ec;
  border-radius:14px;
  padding:20px;
  margin:14px 0
}
button,.btn{
  background:#175cd3;
  color:white;
  border:0;
  border-radius:8px;
  padding:11px 15px;
  text-decoration:none;
  cursor:pointer;
  display:inline-block;
  margin:4px 4px 4px 0
}
button.secondary{background:#475467}
button:disabled{opacity:.6;cursor:not-allowed}
.muted{color:#667085}
.blog{
  border-top:1px solid #eaecf0;
  padding:12px 0
}
.status{padding:8px 0}
a{overflow-wrap:anywhere}
</style>
</head>

<body>

<main class="wrap">

<h1>Blogger SEO Intelligence</h1>

<p class="muted">
Encontre possíveis conflitos entre artigos e revise cada alteração antes de publicar.
</p>

<section class="card" id="auth">

<h2>Conecte sua conta Google</h2>

<p>
A autorização permite acessar seus blogs e artigos.
Nenhum conteúdo será alterado sem aprovação.
</p>

<a
  class="btn"
  href="https://blogger-cannibalization-mcp.onrender.com/api/auth/google"
>
  Conectar com Google
</a>

</section>


<section class="card" id="app" hidden>

<h2>Seus blogs</h2>

<p id="welcome" class="muted"></p>

<button id="load">
Carregar blogs
</button>

<button id="logout" class="secondary">
Sair
</button>

<div id="blogs"></div>

</section>

</main>


<script>

let csrf='';


async function api(path,opts={}){

  const headers={
    'content-type':'application/json',
    ...(opts.headers||{})
  };

  if(opts.method && opts.method!=='GET' && csrf){
    headers['x-csrf-token']=csrf;
  }

  const r=await fetch('/api'+path,{
    ...opts,
    headers
  });

  const data=await r.json().catch(()=>({}));

  if(!r.ok){
    throw Error(
      data.message ||
      data.error ||
      'Falha na solicitação'
    );
  }

  return data;
}


function esc(s){

  return String(s??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


async function init(){

  try{

    const me=await api('/me');

    csrf=me.csrf||'';

    document.querySelector('#auth').hidden=true;

    document.querySelector('#app').hidden=false;

    document.querySelector('#welcome').textContent=
      'Conectado como '+me.user.email;

  }catch(e){

    // Usuário ainda não conectado.

  }

}


document.querySelector('#load').onclick=async()=>{

  try{

    const data=await api('/blogs');

    document.querySelector('#blogs').innerHTML=
      data.blogs.map(
        b=>`

        <div class="blog">

          <b>${esc(b.name)}</b>

          <p>${esc(b.url)}</p>

          <button
            data-id="${b.id}"
            class="sync"
          >
            Sincronizar e analisar
          </button>

        </div>

        `
      ).join('');


    document.querySelectorAll('.sync').forEach(btn=>{

      btn.onclick=async()=>{

        try{

          btn.disabled=true;

          btn.textContent='Sincronizando...';


          const s=await api(
            `/blogs/${btn.dataset.id}/sync`,
            {
              method:'POST'
            }
          );


          btn.textContent='Analisando...';


          const a=await api(
            `/blogs/${btn.dataset.id}/analyze`,
            {
              method:'POST'
            }
          );


          /*
           * Guarda o resultado temporariamente
           * para a nova tela de análise.
           */
          sessionStorage.setItem(
            'bloggerSeoAnalysis',
            JSON.stringify({
              analysis:a,
              sync:s,
              blogId:btn.dataset.id
            })
          );


          /*
           * Abre uma nova página de verdade.
           */
          window.location.href='/analysis.html';


        }catch(e){

          alert(e.message);

          btn.disabled=false;

          btn.textContent='Sincronizar e analisar';

        }

      };

    });

  }catch(e){

    alert(e.message);

  }

};


document.querySelector('#logout').onclick=async()=>{

  try{

    await api(
      '/auth/logout',
      {
        method:'POST'
      }
    );

    location.reload();

  }catch(e){

    alert(e.message);

  }

};


init();

</script>

</body>
</html>
