<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blogger Cannibalization AI</title><style>body{font:16px system-ui;background:#f5f6fa;color:#18202b;margin:0}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #e1e5ec;border-radius:14px;padding:22px;margin:14px 0}button,a.btn{background:#175cd3;color:white;border:0;border-radius:8px;padding:12px 16px;text-decoration:none;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#667085}</style></head><body><main class="wrap"><h1>Blogger Cannibalization AI</h1><p class="muted">Analise conflitos de palavras-chave e controle as alterações no seu Blogger.</p><section class="card" id="auth"><h2>Conecte sua conta Google</h2><p>A autorização permite listar blogs e posts. Nenhum artigo será alterado sem sua aprovação.</p><a class="btn" href="/api/auth/google">Conectar com Google</a></section><section class="card" id="app" hidden><h2>Seus blogs</h2><button id="load">Carregar blogs</button><div id="blogs"></div><pre id="result"></pre><button id="logout">Sair</button></section></main><script>async function api(path,opts={}){let r=await fetch('/api'+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function init(){try{let m=await api('/me');document.querySelector('#auth').hidden=true;document.querySelector('#app').hidden=false;document.querySelector('#load').onclick=async()=>{try{let x=await api('/blogs');document.querySelector('#blogs').innerHTML=x.blogs.map(b=>`<div class="card"><b>${escapeHtml(b.name)}</b><p>${escapeHtml(b.url)}</p><button data-id="${b.id}" class="sync">Sincronizar e analisar</button></div>`).join('');document.querySelectorAll('.sync').forEach(btn=>btn.onclick=async()=>{try{let s=await api(`/blogs/${btn.dataset.id}/sync`,{method:'POST'});let a=await api(`/blogs/${btn.dataset.id}/analyze`,{method:'POST'});document.querySelector('#result').textContent=JSON.stringify({sincronizados:s.synced,conflitos:a.findings},null,2)}catch(e){alert(e.message)}})}catch(e){alert(e.message)}};document.querySelector('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()}}catch{}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
