name: CI

on:
  push:
    branches:
      - v2-saas-alpha
      - feat/article-content-architecture
  pull_request:
    branches:
      - v2-saas-alpha

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: npm run check

      - name: Test suite
        run: npm test
