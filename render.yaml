services:
  - type: web
    name: blogger-cannibalization-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: blogger-cannibalization-ai-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
databases:
  - name: blogger-cannibalization-ai-db
    plan: free
